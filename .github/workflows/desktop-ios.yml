name: Windows and iOS builds

on:
  push:
    branches: [main, 'fix/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  COCOAPODS_DISABLE_STATS: 'true'

jobs:
  windows-release:
    name: Windows x64 release bundle
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare Windows toolchain
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Flutter configuration failed' }
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows engine download failed' }
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter version check failed' }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency resolution failed' }
      - name: Test portable JavaScript runtime with controlled fixtures
        run: |
          $bridge = Join-Path $PWD 'quickjs_c_bridge.dll'
          if (Test-Path -LiteralPath $bridge) { throw 'Unexpected pre-existing test bridge' }
          Copy-Item -LiteralPath 'third_party/flutter_js/windows/shared/quickjs_c_bridge.dll' -Destination $bridge
          try {
            flutter test --no-pub --timeout 90s test/engine/portable_js_engine_test.dart
            if ($LASTEXITCODE -ne 0) { throw 'Windows portable JavaScript tests failed' }
          } finally {
            Remove-Item -LiteralPath $bridge -Force
          }
      - name: Build complete Windows release
        run: flutter build windows --release --no-pub
      - name: Package executable, plugin DLLs, runtime and data
        run: ./.github/scripts/package-windows.ps1
      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liuguang-windows-x64-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Explain build coverage
        if: always()
        run: |
          @'
          ### Windows coverage
          - Builds the x64 release runner and packages the complete Flutter/plugin/MSVC runtime bundle.
          - Runs controlled QuickJS HTTP/HTML/crypto/source lifecycle regression tests.
          - Checks required binaries and assets; records per-file and archive SHA-256 values.
          - No Authenticode certificate is installed. This is not a real-source playback or desktop UI test.
          '@ >> $env:GITHUB_STEP_SUMMARY

  ios-release:
    name: iOS arm64 unsigned release bundle
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare Xcode and CocoaPods build
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get --enforce-lockfile
          # Generates this runner's xcconfig without requiring a signing team.
          flutter build ios --release --no-codesign --config-only --no-pub
          (cd ios && pod install --repo-update)
          plutil -lint ios/Runner/Info.plist ios/Flutter/AppFrameworkInfo.plist ios/Runner.xcodeproj/project.pbxproj
      - name: Test system JavaScriptCore with controlled fixtures
        run: flutter test --no-pub --timeout 90s test/engine/portable_js_engine_test.dart
      - name: Build unsigned iOS device application
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned Payload and build evidence
        run: bash .github/scripts/package-ios.sh
      - name: Upload unsigned iOS bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liuguang-ios-arm64-unsigned-${{ github.sha }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 14
      - name: Upload CocoaPods resolution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-native-dependencies-${{ github.sha }}
          path: |
            ios/Podfile.lock
            ios/Pods/Manifest.lock
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain signing and build coverage
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### iOS coverage
          - Runs controlled portable-source tests on the macOS system JavaScriptCore engine.
          - Builds an iOS 15+ arm64 release with CocoaPods and `--no-codesign`.
          - The artifact contains `Payload/Runner.app`, build metadata, dependency evidence and SHA-256 values.
          - This is an unsigned build artifact, not an installable App Store/TestFlight/Ad Hoc IPA.
          - Distribution requires an Apple signing team, matching bundle ID, provisioning profile and signed export; see docs/PLATFORMS.md.
          - No signing secrets, real subscriptions, camera UI or physical-device playback are exercised.
          EOF
